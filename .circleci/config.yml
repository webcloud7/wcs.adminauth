version: 2.1


workflows:
  tests:
    jobs:
      - plone61py312
      - plone61py313

jobs:

  plone61py312:
    resource_class: medium
    docker:
      - image: webcloud7/plone-test:6.1.1-py312

    environment:
      PIP_FIND_LINKS: /wheelhouse/
      zope_i18n_compile_mo_files: "true"
      WSGI_SERVER_PORT: 65035

    steps:
      - checkout
      - run: pip install uv
      - run: make install
      - run: make lint
      - run: make test

  plone61py313:
    resource_class: medium
    docker:
      - image: webcloud7/plone-test:6.1.1-py313

    environment:
      PIP_FIND_LINKS: /wheelhouse/
      zope_i18n_compile_mo_files: "true"
      WSGI_SERVER_PORT: 65035

    steps:
      - checkout
      - run: pip install uv
      - run: make install
      - run: make lint
      - run: make test
